# Lucent Configuration for this project
# Demonstrates threshold loading from config file

[project]
name = "lucent"
version = "0.1.0-alpha"

[thresholds]
# These are intentionally lenient for this alpha project
max_cyclomatic_complexity = 100.0
max_cognitive_complexity = 150.0
max_nesting_depth = 10.0
max_function_length = 100
min_comment_quality = 0.2
min_maintainability_index = 20.0
max_code_density = 0.9
min_code_density = 0.3
max_long_functions = 50
max_function_parameters = 10
max_deep_nesting_instances = 100
max_magic_numbers = 200

[quality_gates]
fail_on_complexity = false
fail_on_nesting = false
fail_on_maintainability = false
fail_on_code_smells = false
warn_only = true

[ignore]
patterns = [
    "target/",
    "examples/",
    "tests/",
    ".lucent/",
]
use_lucentignore = true
use_gitignore = true

[output]
default_format = "pretty"
show_per_file = false
colorize = true
charts_in_html = true

[rules_config]
enabled = true
fail_on_error = true
fail_on_warning = false

[[rules]]
name = "no-unwrap-in-production"
description = "Avoid .unwrap() calls in production code"
type = "pattern"
pattern = '\.unwrap\('
file_patterns = ["src/**/*.rs"]
exclude_patterns = ["**/tests/**", "**/test.rs"]
severity = "warning"
suggestion = "Use `?` operator or `.unwrap_or()` instead"

[[rules]]
name = "no-panic-in-lib"
description = "Library code should not use panic!"
type = "pattern"
pattern = 'panic!\('
file_patterns = ["src/**/*.rs"]
exclude_patterns = ["src/main.rs", "**/tests/**"]
severity = "error"
suggestion = "Return a Result instead of panicking"

[[rules]]
name = "no-todo-comments"
description = "TODO comments should be tracked in issues"
type = "pattern"
pattern = '(?i)//\s*TODO'
severity = "info"
suggestion = "Create a GitHub issue for this TODO"

[[rules]]
name = "no-dbg-macro"
description = "Debug macros should not be committed"
type = "pattern"
pattern = 'dbg!\('
severity = "warning"
suggestion = "Remove debug macro or use proper logging"

[[rules]]
name = "test-all-files"
description = "Test rule that applies to all Rust files"
type = "pattern"
pattern = 'unwrap\('
language = "Rust"
severity = "error"
suggestion = "Testing rule matching"

# AST-based rules for testing

[[rules]]
name = "require-public-docs"
description = "Public functions must have documentation"
type = "ast"
check = "pub_fn_without_docs"
language = "Rust"
severity = "warning"
suggestion = "Add a /// documentation comment"

[[rules]]
name = "max-5-parameters"
description = "Functions with more than 5 parameters are too complex"
type = "ast"
max_params = 5
language = "Rust"
severity = "warning"
suggestion = "Consider using a struct for parameters"

# Test new AST checks

[[rules]]
name = "limit-match-arms"
description = "Match expressions should not have too many arms"
type = "ast"
max_match_arms = 15
language = "Rust"
severity = "warning"
suggestion = "Consider refactoring into smaller functions"

[[rules]]
name = "avoid-deep-nesting"
description = "Avoid excessive nesting depth"
type = "ast"
max_nesting_depth = 5
language = "Rust"
severity = "warning"
suggestion = "Extract nested logic into separate functions"

# Test metric-based rules

[[rules]]
name = "complexity-threshold"
description = "Keep cyclomatic complexity under control"
type = "metric"
metric = "complexity"
max_value = 20.0
severity = "warning"
file_patterns = ["src/**/*.rs"]
suggestion = "Break down complex functions into smaller ones"

[[rules]]
name = "file-size-limit"
description = "Keep files reasonably sized"
type = "metric"
metric = "file_size"
max_value = 1000
severity = "info"
file_patterns = ["src/**/*.rs"]
suggestion = "Consider splitting large files into smaller modules"
