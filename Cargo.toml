[package]
name = "lucent-code"
version = "0.0.1"
edition = "2021"
authors = ["Ibrahim Cesar <email@ibrahimcesar.com>"]
license = "MIT"
description = "Crystal clear code insights - Fast code metrics analyzer"
homepage = "https://github.com/ibrahimcesar/lucent"
repository = "https://github.com/ibrahimcesar/lucent"
keywords = [
    "metrics",
    "code-quality",
    "complexity",
    "analysis",
    "static-analysis",
]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[lib]
name = "lucent"
path = "src/lib.rs"

[[bin]]
name = "lucent"
path = "src/main.rs"

[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive", "cargo"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File system and path handling
walkdir = "2.5"
ignore = "0.4"  # Respects .gitignore
dirs = "5.0"  # Home directory detection

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Output formatting
colored = "2.1"
tabled = "0.15"

# Date/time for timestamps
chrono = { version = "0.4", features = ["serde"] }

# Regex for pattern matching
regex = "1.10"

# Git integration
git2 = "0.18"

# Parallel processing
rayon = "1.10"

# Tree-sitter for AST-based rules
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"

# Dynamic plugin loading
libloading = "0.8"

# TUI (Terminal User Interface)
ratatui = "0.29"
crossterm = "0.28"

# File watching for real-time updates
notify = "7.0"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
